name: Java CI with Code Coverage

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    - name: Build and Verify Coverage
      # Lệnh verify sẽ chạy test -> tạo report -> check rule 80%
      run: mvn clean verify

    - name: Upload JaCoCo Report
      # Bước này luôn chạy kể cả khi build fail để bạn xem phần nào chưa test
      if: always() 
      uses: actions/upload-artifact@v3
      with:
        name: jacoco-report
        path: target/site/jacoco/